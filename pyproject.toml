[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onyx-vault"
version = "1.0.0"
description = "ONYX: The Cobalt Scarab — a condescending, Groq-powered AI note-taker that live-transcribes lectures into your Obsidian vault."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ONYX Contributors" }]

dependencies = [
    "groq>=0.11.0",
    "pyaudio>=0.2.14",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "rapidfuzz>=3.9.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/onyx-vault"
Issues = "https://github.com/yourusername/onyx-vault/issues"

[project.scripts]
onyx-vault = "onyx_vault.main:app"

[tool.setuptools.packages.find]
where = ["src"]
